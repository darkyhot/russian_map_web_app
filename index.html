<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта регионов России — Метрики</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <label id="upload-btn" for="file-input">
                📂 Загрузить Excel
            </label>
            <input type="file" id="file-input" accept=".xlsx,.xls" hidden>
            <span id="file-name">Файл не загружен</span>
            <div id="legend">
                <span class="legend-item"><span class="legend-color green"></span>Норма (≥100%)</span>
                <span class="legend-item"><span class="legend-color red"></span>Отклонение (<100%)</span>
                <span class="legend-item"><span class="legend-color gray"></span>Нет данных</span>
            </div>
        </div>
        <div id="map-container">
            <svg id="map"></svg>
        </div>
        <div id="tooltip" class="hidden"></div>
        <div id="detail-panel" class="hidden">
            <div id="detail-content">
                <button id="detail-close">&times;</button>
                <h2 id="detail-title"></h2>
                <table id="detail-table">
                    <thead>
                        <tr>
                            <th>Метрика</th>
                            <th>План</th>
                            <th>Факт</th>
                            <th>Выполнение</th>
                        </tr>
                    </thead>
                    <tbody id="detail-tbody"></tbody>
                    <tfoot id="detail-tfoot"></tfoot>
                </table>
            </div>
        </div>
    </div>
    <script src="js/excel.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
